name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - run: ndk-build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: libs/armeabi-v7a/*.so
